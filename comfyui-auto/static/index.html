<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iguana Studio</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e12;
    --surface: #17171e;
    --surface2: #1f1f28;
    --border: #2e2e3a;
    --accent: #7c6af7;
    --accent2: #c97ff0;
    --text: #e2e2ee;
    --muted: #7878a0;
    --danger: #e05555;
    --success: #55c987;
    --radius: 8px;
    --sidebar: 280px;

    /* Gallery tile geometry. The virtual scroller does its row math from these, so they
       must be exact — every tile is hard-sized to them rather than sized by its content.
       --gitem-h = --gthumb + 4 (gap) + 14 (name). Actions live in the hover "⋯" menu, so
       there is no button row to account for. */
    --gtile: 140px;
    --gthumb: 140px;
    --gitem-h: 158px;
    --ggap: 12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  /* ── Top bar ── */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 48px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar h1 { font-size: 16px; font-weight: 600; color: var(--accent2); letter-spacing: .5px; }
  .topbar h1 span { color: var(--muted); font-weight: 400; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); transition: background .3s; }
  .status-dot.online { background: var(--success); }
  .status-label { font-size: 12px; color: var(--muted); }
  .topbar-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }

  /* ── Layout ── */
  .layout {
    display: flex;
    height: calc(100vh - 48px);
    overflow: hidden;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: var(--sidebar);
    min-width: var(--sidebar);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-inner {
    flex: 1;
    overflow-y: auto;
    padding: 14px 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .sidebar-inner::-webkit-scrollbar { width: 4px; }
  .sidebar-inner::-webkit-scrollbar-track { background: transparent; }
  .sidebar-inner::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 14px 0 8px;
  }
  .section-label:first-child { margin-top: 0; }

  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 6px;
  }
  .field-grid.full { grid-template-columns: 1fr; }

  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 11px; color: var(--muted); }
  .field select, .field input[type=text], .field input[type=number] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 5px 8px;
    font-size: 12px;
    outline: none;
    appearance: none;
    cursor: pointer;
    transition: border-color .15s;
  }
  .field select:focus, .field input:focus { border-color: var(--accent); }
  .field select option { background: var(--surface2); color: var(--text); }
  .field select optgroup { background: var(--surface); color: var(--muted); font-style: normal; }

  /* prompt box + preview */
  /* Pinned to the top of the rail so the prompt you are typing and its composed
     result both stay visible while the modifier dropdowns scroll underneath.
     top/padding-top cancel .sidebar-inner's 14px top padding (so the gap scrolls
     away and the block lands flush), and the negative side margins bleed the
     background out to the rail edges — without them the scrolling selects would
     show through the 12px gutters. Both the textarea and the preview are height-
     capped so the pinned block can never grow over the whole rail. */
  .prompt-sticky {
    position: sticky;
    top: -14px;
    z-index: 5;
    background: var(--surface);
    margin: -14px -12px 0;
    padding: 14px 12px 10px;
    border-bottom: 1px solid var(--border);
  }
  .preview-note { opacity: .6; font-style: italic; }
  .prompt-preview {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px;
    font-size: 11px;
    color: var(--accent2);
    line-height: 1.5;
    min-height: 44px;
    max-height: 16vh;
    overflow-y: auto;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .extra-prompt {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 7px 8px;
    font-size: 12px;
    font-family: inherit;
    resize: vertical;
    min-height: 110px;
    max-height: 34vh;
    outline: none;
    transition: border-color .15s;
  }
  .extra-prompt:focus { border-color: var(--accent); }

  /* saved prompts: a picker + two small buttons under the Prompt heading */
  .saved-row { display: flex; gap: 6px; margin: 0 0 8px; }
  .saved-row select {
    flex: 1; min-width: 0; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); padding: 5px 6px; font-size: 12px;
  }
  .saved-row button {
    font-size: 11px; font-weight: 600; background: var(--surface2); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 0 9px; cursor: pointer;
  }
  .saved-row button:hover:not(:disabled) { border-color: var(--accent); }
  .saved-row button:disabled { opacity: .4; cursor: default; }

  /* ── Main workspace ── */
  .workspace {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Mode tabs ── */
  .mode-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    padding: 0 16px;
  }
  .mode-tab {
    padding: 12px 18px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
    user-select: none;
    white-space: nowrap;
  }
  .mode-tab:hover { color: var(--text); }
  .mode-tab.active { color: var(--accent2); border-color: var(--accent2); }

  /* ── Controls bar ── */
  .controls-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: flex-end;
  }
  .ctrl-group { display: flex; flex-direction: column; gap: 3px; }
  .ctrl-group label { font-size: 11px; color: var(--muted); }
  .ctrl-group select, .ctrl-group input[type=number], .ctrl-group input[type=text] {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 5px 8px;
    font-size: 12px;
    outline: none;
    min-width: 80px;
    transition: border-color .15s;
    appearance: none;
  }
  .ctrl-group select:focus, .ctrl-group input:focus { border-color: var(--accent); }
  /* Same treatment the sidebar selects get — without it the dropped-open list paints
     the group headers on the browser's default light background. */
  .ctrl-group select option { background: var(--surface2); color: var(--text); }
  .ctrl-group select optgroup { background: var(--surface); color: var(--muted); font-style: normal; }

  /* negative prompt collapsible */
  .neg-toggle {
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    padding: 4px 0;
  }
  .neg-toggle:hover { color: var(--text); }
  #neg-wrap { display: none; }
  #neg-wrap.open { display: block; }
  #neg-prompt {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 6px 8px;
    font-size: 12px;
    font-family: inherit;
    resize: vertical;
    min-height: 44px;
    outline: none;
    transition: border-color .15s;
    margin-top: 4px;
  }
  #neg-prompt:focus { border-color: var(--accent); }

  /* refine source */
  .refine-source {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 200px;
  }
  .refine-thumb {
    width: 54px;
    height: 54px;
    border-radius: 6px;
    object-fit: cover;
    border: 2px solid var(--accent);
    cursor: pointer;
  }
  .refine-placeholder {
    width: 54px;
    height: 54px;
    border-radius: 6px;
    border: 2px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 22px;
    cursor: pointer;
  }
  .refine-placeholder:hover { border-color: var(--accent); color: var(--accent); }
  /* The visible affordance is the placeholder/thumb next to it; the raw input is only
     there to be .click()ed. Selected by id per mode, so a new source-image mode has to be
     added here too — Edit was missing and showed a stray file picker. */
  #refine-upload-input, #edit-upload-input, #animate-upload-input { display: none; }

  /* person dropzone */
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    min-width: 140px;
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: rgba(124,106,247,.06); }
  .dropzone p { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .dropzone .icon { font-size: 18px; }
  #person-upload-input { display: none; }

  .thumb-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-width: 260px;
  }
  .thumb-strip img {
    width: 44px;
    height: 44px;
    object-fit: cover;
    border-radius: 4px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: border-color .15s;
  }
  .thumb-strip img:hover { border-color: var(--danger); }

  /* generate button */
  .btn-generate {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 9px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    white-space: nowrap;
    align-self: flex-end;
  }
  .btn-generate:hover { opacity: .9; }
  .btn-generate:active { transform: scale(.97); }
  .btn-generate:disabled { opacity: .45; cursor: not-allowed; }

  /* ── Output area ── */
  .output-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
    align-content: flex-start;
  }
  .output-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    gap: 10px;
    font-size: 13px;
  }
  .output-placeholder .big { font-size: 48px; }

  /* job status */
  .job-status {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    color: var(--muted);
    font-size: 13px;
  }
  /* Takes the leftover width so the bar tracks the panel rather than a fixed size, and
     sits after the text, which is the part you read first. */
  .job-bar {
    flex: 1; min-width: 80px; max-width: 320px; height: 4px;
    background: var(--surface2); border-radius: 2px; overflow: hidden;
  }
  .job-bar > span {
    display: block; height: 100%; width: 0;
    background: var(--accent); transition: width .4s ease;
  }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .output-card {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid var(--border);
    cursor: pointer;
    transition: border-color .15s, transform .15s;
    max-width: 480px;
  }
  .output-card:hover { border-color: var(--accent); transform: scale(1.01); }
  .output-card img, .output-card video {
    display: block;
    max-width: 100%;
    max-height: 480px;
    width: auto;
    height: auto;
    cursor: zoom-in;
  }
  /* Both the result card and the gallery tile hang their actions off one shared "⋯"
     affordance — see .item-menu below. The button only shows on hover, or while its own
     menu is open (otherwise the trigger vanishes the moment the pointer moves to the menu). */
  .item-menu-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    z-index: 2;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 6px;
    color: #fff;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    backdrop-filter: blur(4px);
    transition: opacity .15s, background .15s;
  }
  .gallery-item:hover .item-menu-btn,
  .output-card:hover .item-menu-btn,
  .item-menu-btn:focus-visible,
  .item-menu-btn.open { opacity: 1; }
  .item-menu-btn:hover, .item-menu-btn.open { background: rgba(0,0,0,.85); }

  /* One menu element, lifted to <body> and position:fixed. It has to live outside the tile:
     the gallery scroller clips its overflow, and virtualisation destroys tiles on scroll. */
  .item-menu {
    position: fixed;
    z-index: 500;
    min-width: 158px;
    display: none;
    flex-direction: column;
    padding: 4px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 10px 28px rgba(0,0,0,.55);
  }
  .item-menu.open { display: flex; }
  .item-menu a, .item-menu button {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 10px;
    background: none;
    border: 0;
    border-radius: 5px;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    text-align: left;
    text-decoration: none;
    cursor: pointer;
  }
  .item-menu a:hover, .item-menu button:hover { background: rgba(255,255,255,.07); }
  .item-menu .mi-icon { width: 14px; text-align: center; color: var(--muted); }
  .item-menu .danger { color: var(--danger); }
  .item-menu .danger:hover { background: rgba(224,85,85,.15); }
  .item-menu .danger .mi-icon { color: var(--danger); }
  .item-menu .sep { height: 1px; margin: 4px 2px; background: var(--border); }

  /* error card */
  .error-card {
    background: rgba(224,85,85,.1);
    border: 1px solid var(--danger);
    border-radius: var(--radius);
    padding: 12px 16px;
    color: var(--danger);
    font-size: 13px;
    width: 100%;
  }

  /* ── LoRA stack ── */
  /* Rows are a chain, not a set: they are applied in listed order, so the list is
     reorderable and the ordinal is shown rather than left implicit. */
  .lora-row {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 7px 8px;
    margin-bottom: 6px;
  }
  .lora-row-top { display: flex; align-items: center; gap: 6px; }
  .lora-ord {
    flex: 0 0 auto;
    font-size: 10px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .lora-row select {
    flex: 1;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-size: 11px;
    padding: 4px 5px;
  }
  .lora-row select:focus { border-color: var(--accent); outline: none; }
  .lora-x, .lora-move {
    flex: 0 0 auto;
    background: none;
    border: 1px solid transparent;
    border-radius: 4px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1;
    padding: 3px 5px;
    cursor: pointer;
  }
  .lora-move:hover { color: var(--text); background: var(--surface); }
  .lora-move:disabled { opacity: .25; cursor: default; }
  .lora-x:hover { color: var(--danger); background: rgba(224,85,85,.15); }
  .lora-strength { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
  .lora-strength input[type=range] { flex: 1; min-width: 0; }
  .lora-strength .val {
    flex: 0 0 30px;
    text-align: right;
    font-size: 10px;
    color: var(--accent2);
    font-variant-numeric: tabular-nums;
  }
  .lora-add {
    width: 100%;
    background: rgba(124,106,247,.15);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    color: var(--accent2);
    font-size: 11px;
    padding: 5px;
    cursor: pointer;
    transition: background .15s;
  }
  .lora-add:hover { background: rgba(124,106,247,.3); }
  .lora-add:disabled {
    background: none;
    border-color: var(--border);
    color: var(--muted);
    cursor: default;
  }
  .lora-note { font-size: 10px; color: var(--muted); line-height: 1.5; margin-top: 6px; }

  /* ── Gallery ── */
  /* Collapsed it's just a header strip pinned under the output area. Open, it takes the
     whole display area over: the section grows and .output-area is hidden outright, so the
     grid gets the workspace's full width and height to wrap into. */
  .gallery-section {
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .gallery-section.open {
    flex: 1;
    flex-shrink: 1;
  }
  /* Toggled from toggleGallery() rather than with :has() — the output area is an earlier
     sibling, so no combinator reaches it, and this keeps the rule off :has() support. */
  .workspace.gallery-open .output-area { display: none; }
  .gallery-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    cursor: pointer;
    user-select: none;
  }
  .gallery-header:hover { background: rgba(255,255,255,.02); }
  .gallery-title { font-size: 13px; font-weight: 600; }
  .gallery-count { font-size: 11px; color: var(--muted); }
  .gallery-toggle-icon { margin-left: auto; color: var(--muted); transition: transform .2s; font-size: 12px; }
  .gallery-toggle-icon.open { transform: rotate(180deg); }

  .gallery-grid {
    display: none;
    padding: 10px 16px 14px;
    overflow-y: auto;
    overflow-x: hidden;
    flex: 1;
    min-height: 0;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .gallery-grid.open { display: block; }
  .gallery-grid::-webkit-scrollbar { width: 8px; }
  .gallery-grid::-webkit-scrollbar-track { background: transparent; }
  .gallery-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* The sizer is stretched to the full height every row would occupy, so the native
     scrollbar is correct while only the visible window of tiles exists in the DOM. */
  .gallery-sizer { position: relative; width: 100%; }
  .gallery-grid .inner {
    display: grid;
    gap: var(--ggap);
    align-content: start;
    justify-content: start;
    position: absolute;
    top: 0; left: 0;
    will-change: transform;
  }
  .gallery-empty {
    color: var(--muted);
    font-size: 13px;
    padding: 24px 0;
  }
  .gallery-item {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 4px;
    white-space: normal;
    width: var(--gtile);
    height: var(--gitem-h);
  }
  .gallery-item .gthumb {
    width: 100%;
    height: var(--gthumb);
    object-fit: cover;
    border-radius: 6px;
    border: 2px solid var(--border);
    cursor: pointer;
    transition: border-color .15s, transform .15s;
    display: block;
    background: var(--surface2);
  }
  .gallery-item .gthumb:hover { border-color: var(--accent); transform: scale(1.04); }
  .gallery-item .gname {
    font-size: 10px;
    line-height: 14px;
    height: 14px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── Utility ── */
  .hidden { display: none !important; }
  .flex-gap { display: flex; gap: 8px; align-items: center; }
  .ctrl-section { display: flex; flex-wrap: wrap; gap: 10px; width: 100%; align-items: flex-end; }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <h1>Iguana <span>Studio</span></h1>
  <div class="flex-gap">
    <div class="status-dot" id="status-dot"></div>
    <span class="status-label" id="status-label">Connecting…</span>
  </div>
  <div class="topbar-right">
    <button class="btn-generate" id="top-gen-btn" onclick="generate()">Generate</button>
  </div>
</div>

<!-- Main layout -->
<div class="layout">

  <!-- ── Sidebar: Prompt + modifier presets ── -->
  <aside class="sidebar">
    <div class="sidebar-inner">

      <div class="prompt-sticky">
        <div class="section-label" style="display:flex;align-items:center;justify-content:space-between;">
          Prompt

<script>
// ── Field IDs saved to localStorage ───────────────────────────────────────
const PERSIST_IDS = [
  'f-eyes','f-expression',
  'f-clothing','f-setting','f-lighting','f-style','f-camera',
  'f-pose','f-focus',
  'f-extra',
  'g-checkpoint','g-width','g-height','g-steps','g-cfg','g-seed',
  'pm-model','pm-width','pm-height','pm-steps','pm-cfg',
  'r-checkpoint','r-denoise','r-steps','r-cfg','r-seed',
  'k-instruction','k-guidance','k-steps','k-seed',
  'v-motion','v-length','v-fps','v-size','v-steps','v-cfg','v-shift','v-seed',
  'neg-prompt',
];

// ── App state ──────────────────────────────────────────────────────────────
let currentMode   = 'generate';
let personFiles   = [];           // File[] for PhotoMaker
let refineFile    = null;         // File for img2img
let refineGallery = null;         // {name, url} picked from gallery
let editFile      = null;         // File for Kontext
let editGallery   = null;         // {name, url} picked from gallery
let animateFile    = null;        // File chosen for Animate
let animateGallery = null;        // {name, url} picked from gallery
let pollTimer     = null;
let comfyOnline   = false;
let galleryOpen   = false;
let loraOptions   = [];           // filenames from /loras
let loraStack     = [];           // [{name, strength}] — ORDER IS THE CHAIN ORDER

// LoRAs merge into a checkpoint, so they only mean anything in the modes that load one.
// Edit (Kontext) and Animate (WAN) load a bare UNet with the text encoder from a separate
// node, which has no single MODEL+CLIP source to splice a LoraLoader into.
const LORA_MODES = ['generate', 'person', 'refine'];

// ── Persistence ────────────────────────────────────────────────────────────
// Last-loaded snapshot. Kept around because some fields (the checkpoint selects)
// are populated asynchronously and can't be restored until their options exist.
let savedState = {};

// Selects whose options arrive over the network. Until they do, their value is the
// empty placeholder — never let that overwrite a real saved choice.
const ASYNC_SELECT_IDS = ['g-checkpoint', 'r-checkpoint'];

function saveState() {
  const data = { __mode: currentMode };
  for (const id of PERSIST_IDS) {
    const el = document.getElementById(id);
    if (el) data[id] = el.value;
  }
  for (const id of ASYNC_SELECT_IDS) {
    if (!data[id] && savedState[id]) data[id] = savedState[id];
  }
  data.__loras = loraStack;
  savedState = data;
  localStorage.setItem('studio_v1', JSON.stringify(data));
}

function loadState() {
  let data;
  try { data = JSON.parse(localStorage.getItem('studio_v1') || '{}'); }
  catch(e) { return; }
  savedState = data;
  if (Array.isArray(data.__loras)) loraStack = data.__loras;
  for (const id of PERSIST_IDS) {
    if (data[id] !== undefined) {
      const el = document.getElementById(id);
      if (el) el.value = data[id];
    }
  }
  if (data.__mode) switchMode(data.__mode, true);
  // sync denoise display
  const den = document.getElementById('r-denoise');
  if (den) document.getElementById('denoise-val').textContent = parseFloat(den.value).toFixed(2);
  // sync Kontext guidance display
  const gd = document.getElementById('k-guidance');
  if (gd) document.getElementById('k-guidance-val').textContent = parseFloat(gd.value).toFixed(1);
}

// ── Prompt composition ─────────────────────────────────────────────────────
function get(id) { return (document.getElementById(id)?.value || '').trim(); }

// The manual prompt leads; the remaining dropdowns only append modifiers after it.
// This order is fixed in code and independent of the sidebar's visual order.
function buildPrompt() {
  const parts = [];

  const manual = get('f-extra');
  if (manual) parts.push(manual);

  const expr = get('f-expression');
  if (expr) parts.push(expr);

  const eyes = get('f-eyes');
  if (eyes) parts.push(eyes + ' eyes');

  const clothing = get('f-clothing');
  if (clothing) parts.push('wearing ' + clothing);

  // Setting values carry their own preposition ("on a beach", "aboard a spaceship"),
  // so this pushes them verbatim.
  const setting = get('f-setting');
  if (setting) parts.push(setting);

  for (const id of ['f-lighting', 'f-style', 'f-camera', 'f-pose', 'f-focus']) {
    const v = get(id);
    if (v) parts.push(v);
  }

  let prompt = parts.join(', ');

  // Person mode: prepend the PhotoMaker trigger word
  if (currentMode === 'person') prompt = 'img ' + prompt;

  return prompt;
}

const PROMPT_FIELDS = [
  'f-extra',
  'f-eyes','f-expression',
  'f-clothing','f-setting','f-lighting','f-style','f-camera',
  'f-pose','f-focus',
];

// ── Saved prompts ──────────────────────────────────────────────────────────
// What a saved prompt holds: the sidebar (text + modifiers) and the negative. Not the
// checkpoint or sampler numbers — reloading a prompt shouldn't swap the model.
const SAVED_PROMPT_FIELDS = [...PROMPT_FIELDS, 'neg-prompt'];
let savedPrompts = [];

function currentPromptFields() {
  const out = {};
  for (const id of SAVED_PROMPT_FIELDS) out[id] = document.getElementById(id)?.value || '';
  return out;
}

function renderSavedPrompts(select = '') {
  const sel = document.getElementById('saved-prompts');
  sel.replaceChildren(new Option(savedPrompts.length ? 'Saved prompts…' : 'No saved prompts yet', ''));
  for (const p of savedPrompts) sel.add(new Option(p.name, p.name));
  sel.value = select;
  document.getElementById('sp-del').disabled = !sel.value;
}

async function loadSavedPrompts(select = '') {
  try {
    savedPrompts = (await fetch('/prompts').then(r => r.json())).prompts || [];
  } catch (e) { savedPrompts = []; }
  renderSavedPrompts(select);
}

function applySavedPrompt(name) {
  const p = savedPrompts.find(x => x.name === name);
  if (!p) return;
  const now = currentPromptFields();
  const dirty = PROMPT_FIELDS.some(id => now[id]) &&
                SAVED_PROMPT_FIELDS.some(id => (now[id] || '') !== (p.fields[id] || ''));
  if (dirty && !confirm(`Replace the current prompt with "${p.name}"?`)) {
    renderSavedPrompts('');
    return;
  }
  for (const id of SAVED_PROMPT_FIELDS) {
    const el = document.getElementById(id);
    // A saved dropdown value that no longer exists falls back to "—" rather than
    // leaving the select on whatever it showed before.
    if (el) el.value = p.fields[id] ?? '';
    if (el && el.tagName === 'SELECT' && el.value !== (p.fields[id] ?? '')) el.value = '';
  }
  updatePreview();
  document.getElementById('sp-del').disabled = false;
}

async function savePrompt() {
  const fields = currentPromptFields();
  if (!PROMPT_FIELDS.some(id => fields[id])) { alert('There is no prompt to save yet.'); return; }
  const current = document.getElementById('saved-prompts').value;
  const suggestion = current || fields['f-extra'].split(/[,.\n]/)[0].trim().slice(0, 50);
  const name = (prompt('Save this prompt as:', suggestion) || '').trim();
  if (!name) return;
  if (name !== current && savedPrompts.some(p => p.name === name) &&
      !confirm(`A saved prompt called "${name}" already exists. Overwrite it?`)) return;
  const r = await fetch('/prompts', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                      body: JSON.stringify({ name, fields }) });
  if (!r.ok) { alert('Could not save: ' + ((await r.json().catch(() => ({}))).detail || r.status)); return; }
  await loadSavedPrompts(name);
}

async function deleteSavedPrompt() {
  const name = document.getElementById('saved-prompts').value;
  if (!name || !confirm(`Delete the saved prompt "${name}"? The current text stays as it is.`)) return;
  const r = await fetch('/prompts/' + encodeURIComponent(name), { method: 'DELETE' });
  if (!r.ok && r.status !== 404) { alert('Could not delete: ' + r.status); return; }
  await loadSavedPrompts('');
}

document.getElementById('saved-prompts').addEventListener('change', e => {
  if (e.target.value) applySavedPrompt(e.target.value);
  else document.getElementById('sp-del').disabled = true;
});

function clearPrompt() {
  for (const id of PROMPT_FIELDS) {
    const el = document.getElementById(id);
    if (el) el.value = '';
  }
  updatePreview();
}

// What will actually be sent, for this mode. Edit and Animate ignore the sidebar and
// carry their own box, so the preview has to ask the mode rather than always rendering
// buildPrompt() — it used to claim the sidebar text was in play during an Edit, which was
// simply untrue. Submit reads through here too, so the two can't disagree.
function activePrompt() {
  if (currentMode === 'edit')    return get('k-instruction');
  if (currentMode === 'animate') return get('v-motion');
  return buildPrompt();
}

const SIDEBAR_UNUSED = {
  edit:    'Edit uses the Instruction box — the sidebar is not used.',
  animate: 'Animate uses the Motion box — the sidebar is not used.',
};

function updatePreview() {
  const p = activePrompt();
  const el = document.getElementById('prompt-preview');
  el.textContent = p || SIDEBAR_UNUSED[currentMode] || '—';
  el.classList.toggle('preview-note', !p && !!SIDEBAR_UNUSED[currentMode]);
  saveState();
}

// Wire sidebar fields
document.querySelectorAll('.sidebar select, .sidebar textarea').forEach(el => {
  el.addEventListener('change', updatePreview);
  el.addEventListener('input',  updatePreview);
});

// Wire control fields to save state. `textarea` is in the selector for the Edit and
// Animate prompt boxes — without it those fields silently fail to persist. They also feed
// the preview now, so this goes through updatePreview (which saves state itself).
document.querySelectorAll('.controls-bar select, .controls-bar input, .controls-bar textarea').forEach(el => {
  el.addEventListener('change', updatePreview);
  el.addEventListener('input',  updatePreview);
});

// ── Mode switching ─────────────────────────────────────────────────────────
function switchMode(mode, silent) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.mode === mode)
  );
  document.querySelectorAll('.ctrl-section').forEach(s => s.classList.add('hidden'));
  const ctrl = document.getElementById('ctrl-' + mode);
  if (ctrl) ctrl.classList.remove('hidden');
  document.getElementById('lora-section')
    .classList.toggle('hidden', !LORA_MODES.includes(mode));
  updatePreview();
  if (!silent) saveState();
}

// ── Per-checkpoint recommended configs ────────────────────────────────────
const CKPT_CONFIGS = {
  // SDXL / SD 1.5
  'ponyDiffusionV6XL_v6StartWithThisOne.safetensors':
    { steps: 28, cfg: 7.0,  w: 1024, h: 1024 },
  'juggernautXL_ragnarokBy.safetensors':
    { steps: 35, cfg: 7.0,  w: 1024, h: 1024 },
  'dreamshaperXL_lightningDPMSDE.safetensors':
    { steps: 6,  cfg: 2.0,  w: 1024, h: 1024 },
  'realvisxlV50_v50LightningBakedvae.safetensors':
    { steps: 6,  cfg: 2.0,  w: 1024, h: 1024 },
  'sd_xl_base_1.0.safetensors':
    { steps: 25, cfg: 7.0,  w: 1024, h: 1024 },
  'secuanceDreamDeliberate_v125Main.safetensors':
    { steps: 25, cfg: 7.0,  w: 512,  h: 512  },
  'absolutereality_v181.safetensors':
    { steps: 25, cfg: 7.0,  w: 512,  h: 512  },
  'crealismTerraMirabilis_v2025Steps.safetensors':
    { steps: 25, cfg: 7.0,  w: 1024, h: 1024 },
  'v1-5-pruned-emaonly-fp16.safetensors':
    { steps: 20, cfg: 7.0,  w: 512,  h: 512  },
};

// filename -> base ("FLUX" | "SDXL" | "SD 1.5"), filled by loadCheckpoints() from the
// server's classification. defaults.base_of() is the single source of truth; the substring
// fallbacks below only cover the window before /checkpoints has answered.
let checkpointBase = {};

function _baseOf(ckpt) {
  return checkpointBase[ckpt]
      || (ckpt.toLowerCase().includes('flux') ? 'FLUX'
      :   ckpt.toLowerCase().includes('xl')   ? 'SDXL' : 'SD 1.5');
}

function _isFlux(ckpt) { return _baseOf(ckpt) === 'FLUX'; }
function _isSchnell(ckpt) { return ckpt.toLowerCase().includes('schnell'); }

function _fluxConfig(ckpt) {
  return _isSchnell(ckpt)
    ? { steps: 4,  cfg: 1.0, w: 1024, h: 1024 }
    : { steps: 20, cfg: 3.5, w: 1024, h: 1024 };
}

// Labels and negative-prompt visibility follow the checkpoint's architecture, not the
// user's numbers — safe to run on every boot without clobbering restored settings.
function applyCheckpointUI(ckpt, prefix) {
  const flux = _isFlux(ckpt);
  if (prefix === 'g') {
    // Relabel CFG ↔ Guidance and toggle negative prompt
    document.getElementById('g-cfg-label').textContent = flux ? 'Guidance' : 'CFG';
    document.getElementById('neg-wrap').style.display  = flux ? 'none' : '';
    document.querySelector('[onclick="toggleNeg()"]').style.display = flux ? 'none' : '';
  } else if (prefix === 'r') {
    document.getElementById('r-cfg-label').textContent = flux ? 'Guidance' : 'CFG';
  }
}

// Stamps the checkpoint's recommended numbers over the current ones. Only for an explicit
// model change (or a first visit with nothing saved) — never on a plain reload, or the
// user's own steps/CFG would be thrown away every time they open the page.
function applyCheckpointConfig(ckpt, prefix) {
  const flux = _isFlux(ckpt);
  const conf = flux
    ? _fluxConfig(ckpt)
    : CKPT_CONFIGS[ckpt] || (_baseOf(ckpt) === 'SDXL'
        ? { steps: 25, cfg: 7.0, w: 1024, h: 1024 }
        : { steps: 25, cfg: 7.0, w: 512,  h: 512  });

  if (prefix === 'g') {
    document.getElementById('g-width').value  = conf.w;
    document.getElementById('g-height').value = conf.h;
    document.getElementById('g-steps').value  = conf.steps;
    document.getElementById('g-cfg').value    = conf.cfg;
  } else if (prefix === 'r') {
    document.getElementById('r-steps').value = conf.steps;
    document.getElementById('r-cfg').value   = conf.cfg;
  }
  applyCheckpointUI(ckpt, prefix);
  saveState();
}

function onCheckpointChange() {
  applyCheckpointConfig(document.getElementById('g-checkpoint').value, 'g');
}
function onRefineCheckpointChange() {
  applyCheckpointConfig(document.getElementById('r-checkpoint').value, 'r');
}

// ── Person photos ──────────────────────────────────────────────────────────
function onPersonFiles(fileList) {
  for (const f of fileList) personFiles.push(f);
  renderPersonThumbs();
}
function onPersonDrop(ev) {
  ev.preventDefault();
  document.getElementById('person-dropzone').classList.remove('drag');
  onPersonFiles(ev.dataTransfer.files);
}
function renderPersonThumbs() {
  const strip = document.getElementById('person-thumbs');
  strip.innerHTML = '';
  personFiles.forEach((f, i) => {
    const img = document.createElement('img');
    img.src   = URL.createObjectURL(f);
    img.title = 'Click to remove';
    img.onclick = () => { personFiles.splice(i, 1); renderPersonThumbs(); };
    strip.appendChild(img);
  });
  document.getElementById('person-count').textContent = personFiles.length;
  document.getElementById('person-thumbs-col').style.display = personFiles.length ? '' : 'none';
}

// ── Refine source ──────────────────────────────────────────────────────────
function onRefineFile(file) {

// Frames are the time budget, and 49 frames means nothing without the fps beside it.
// The 4n+1 snap is mirrored from workflows/video.py clamp_length() so the label can't
// promise a length the server will round away.
function updateAnimateLength() {
  const raw = parseInt(document.getElementById('v-length').value, 10) || 81;
  const fps = parseInt(document.getElementById('v-fps').value, 10) || 24;
  const n   = Math.floor((Math.max(5, Math.min(raw, 121)) - 1) / 4) * 4 + 1;
  document.getElementById('v-length-val').textContent =
    `${n}f · ${(n / Math.max(fps, 1)).toFixed(1)}s`;
}

// ── Negative prompt toggle ─────────────────────────────────────────────────
function toggleNeg() {
  document.getElementById('neg-wrap').classList.toggle('open');
}

// ── Generate ───────────────────────────────────────────────────────────────
async function generate() {
  closeGallery();
  if (!comfyOnline) { alert('ComfyUI is not running. Start ComfyUI Desktop first.'); return; }

  // Edit and Animate are instruction-driven: each takes its prompt from its own box and
  // ignores the character builder, so buildPrompt() doesn't apply to either.
  const prompt = activePrompt();

  if (currentMode === 'edit') {
    if (!editFile && !editGallery) {
      alert('Pick a source image first. Upload one or click Edit on a gallery image.'); return;
    }
    if (!prompt) {
      alert('Describe the change you want, e.g. "change the background to a snowy mountain".'); return;
    }
  } else if (currentMode === 'animate') {
    if (!animateFile && !animateGallery) {
      alert('Pick a source image first. Upload one or click Animate on a gallery image.'); return;
    }
    if (!prompt) {
      alert('Describe the motion, e.g. "she raises her right hand and touches her shoulder".\n\n' +
            'The subject is already fixed by the source image — this box says what it DOES.'); return;
    }
  } else if (!prompt || prompt === '—') {
    alert('Build your character first.'); return;
  }

  if (currentMode === 'person' && personFiles.length === 0) {
    alert('Add at least one reference photo in Person mode.'); return;
  }
  if (currentMode === 'refine' && !refineFile && !refineGallery) {
    alert('Pick a source image first. Upload one or click Refine on a gallery image.'); return;
  }

  const btn = document.getElementById('top-gen-btn');
  btn.disabled = true;
  btn.textContent = 'Generating…';

  const fd  = new FormData();
  const neg = (document.getElementById('neg-prompt').value || '').trim();

  // Sent for every task; the server only threads it into the checkpoint-based builders,
  // so Edit and Animate ignore it rather than needing a special case here.
  if (LORA_MODES.includes(currentMode)) fd.append('loras', JSON.stringify(activeLoras()));

  if (currentMode === 'generate') {
    fd.append('task',       'text2img');
    fd.append('prompt',     prompt);
    fd.append('negative',   neg);
    fd.append('checkpoint', document.getElementById('g-checkpoint').value);
    fd.append('width',      document.getElementById('g-width').value);
    fd.append('height',     document.getElementById('g-height').value);
    fd.append('steps',      document.getElementById('g-steps').value);
    fd.append('cfg',        document.getElementById('g-cfg').value);
    fd.append('seed',       document.getElementById('g-seed').value);

  } else if (currentMode === 'person') {
    fd.append('task',      'photomaker');
    fd.append('prompt',    prompt);
    fd.append('negative',  neg);
    fd.append('pm_model',  document.getElementById('pm-model').value);
    fd.append('pm_width',  document.getElementById('pm-width').value);
    fd.append('pm_height', document.getElementById('pm-height').value);
    fd.append('steps',     document.getElementById('pm-steps').value);
    fd.append('cfg',       document.getElementById('pm-cfg').value);
    for (const f of personFiles) fd.append('images', f);

  } else if (currentMode === 'refine') {
    fd.append('task',       'img2img');
    fd.append('prompt',     prompt);
    fd.append('negative',   neg);
    fd.append('checkpoint', document.getElementById('r-checkpoint').value);
    fd.append('denoise',    document.getElementById('r-denoise').value);
    fd.append('steps',      document.getElementById('r-steps').value);
    fd.append('cfg',        document.getElementById('r-cfg').value);
    fd.append('seed',       document.getElementById('r-seed').value);

    if (refineFile) {
      fd.append('image', refineFile);
    } else if (refineGallery) {
      try {
        const resp = await fetch(refineGallery.url);
        const blob = await resp.blob();
        fd.append('image', blob, refineGallery.name);
      } catch(e) {
        alert('Could not load source image: ' + e.message);
        btn.disabled = false; btn.textContent = 'Generate';
        return;
      }
    }

  } else if (currentMode === 'edit') {
    // Kontext takes no negative prompt and no size — the negative is zeroed
    // server-side and the output size is derived from the source. `cfg` carries
    // Guidance here; sampler CFG is pinned to 1.0 in workflows/kontext.py.
    fd.append('task',   'kontext');
    fd.append('prompt', prompt);
    fd.append('cfg',    document.getElementById('k-guidance').value);
    fd.append('steps',  document.getElementById('k-steps').value);
    fd.append('seed',   document.getElementById('k-seed').value);

    if (editFile) {
      fd.append('image', editFile);
    } else if (editGallery) {
      try {
        const resp = await fetch(editGallery.url);
        const blob = await resp.blob();
        fd.append('image', blob, editGallery.name);
      } catch(e) {
        alert('Could not load source image: ' + e.message);
        btn.disabled = false; btn.textContent = 'Generate';
        return;
      }
    }

  } else if (currentMode === 'animate') {
    // The subject is already fixed by the source image, so the prompt describes the
    // motion. Size comes from one select rather than two boxes: WAN has a native
    // resolution the way SDXL does, and free-form w/h invites drifting off it.
    const [vw, vh] = document.getElementById('v-size').value.split('x');
    fd.append('task',     'img2vid');
    fd.append('prompt',   prompt);
    fd.append('negative', neg);
    fd.append('width',    vw);
    fd.append('height',   vh);
    fd.append('length',   document.getElementById('v-length').value);
    fd.append('fps',      document.getElementById('v-fps').value);
    fd.append('steps',    document.getElementById('v-steps').value);
    fd.append('cfg',      document.getElementById('v-cfg').value);
    fd.append('shift',    document.getElementById('v-shift').value);
    fd.append('seed',     document.getElementById('v-seed').value);

    if (animateFile) {
      fd.append('image', animateFile);
    } else if (animateGallery) {
      try {
        const resp = await fetch(animateGallery.url);
        const blob = await resp.blob();
        fd.append('image', blob, animateGallery.name);
      } catch(e) {
        alert('Could not load source image: ' + e.message);
        btn.disabled = false; btn.textContent = 'Generate';
        return;
      }
    }
  }

  showJobStatus('Queuing…');

  try {
    const resp = await fetch('/generate', { method: 'POST', body: fd });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ detail: resp.statusText }));
      throw new Error(err.detail || resp.statusText);
    }
    const { job_id } = await resp.json();
    pollJob(job_id);
  } catch(e) {
    showError(e.message);
    btn.disabled = false; btn.textContent = 'Generate';
  }
}

// ── Job polling ────────────────────────────────────────────────────────────
// "Running…" is fine for a 4-second still and useless for a 3-minute video, where the
// only question is whether it is 40% done or hung. The server relays ComfyUI's step
// counter, so show the real thing.
function fmtEta(secs) {
  if (secs == null || secs < 0) return '';
  if (secs < 60) return `~${secs}s left`;
  const m = Math.floor(secs / 60), r = secs % 60;
  return `~${m}m ${String(r).padStart(2, '0')}s left`;
}

function jobStatusText(data) {
  const p = data.progress;
  const phase = data.phase || 'working';
  if (!p || !p.max) return phase.charAt(0).toUpperCase() + phase.slice(1) + '…';
  // Sampling is the bulk of a video job but not all of it — the model load lands before
  // the first step and the decode + mux after the last — so the phase is shown next to
  // the bar rather than letting the step count imply the whole run.
  const pct = Math.round(p.value / p.max * 100);
  const eta = fmtEta(data.eta);
  return `${phase} · step ${p.value}/${p.max} · ${pct}%${eta ? ' · ' + eta : ''}`;
}

function pollJob(jobId) {
  clearTimeout(pollTimer);
  showJobStatus('Queued…');

  async function check() {
    try {
      const data = await fetch('/job/' + jobId).then(r => r.json());
      const btn = document.getElementById('top-gen-btn');

      if (data.status === 'done') {
        clearStatus();
        btn.disabled = false; btn.textContent = 'Generate';
        showOutputs(data.files);
        loadGallery();
      } else if (data.status === 'error') {
        showError(data.message || 'Unknown error');
        btn.disabled = false; btn.textContent = 'Generate';
      } else {
        updateJobStatus(jobStatusText(data), data.progress);
        pollTimer = setTimeout(check, 2000);
      }
    } catch(e) {
      pollTimer = setTimeout(check, 3000);
    }
  }
  check();
}

// ── Output rendering ───────────────────────────────────────────────────────
function showJobStatus(msg) {
  clearStatus();
  document.getElementById('output-placeholder').classList.add('hidden');
  const div = document.createElement('div');
  div.className = 'job-status'; div.id = 'job-status-el';
  div.innerHTML = `<div class="spinner"></div><span id="job-status-text">${msg}</span>` +
                  `<div class="job-bar" id="job-bar" hidden><span></span></div>`;
  document.getElementById('output-area').prepend(div);
}

// Rewrite the text and bar in place rather than re-rendering the card: replacing the node
// restarts the CSS spinner animation, which reads as the job having started over.
function updateJobStatus(msg, progress) {
  const el = document.getElementById('job-status-text');
  if (!el) return showJobStatus(msg);
  el.textContent = msg;
  const bar = document.getElementById('job-bar');
  if (!bar) return;
  if (progress && progress.max) {
    bar.hidden = false;
    bar.firstChild.style.width = (progress.value / progress.max * 100).toFixed(1) + '%';
  } else {
    bar.hidden = true;
  }
}

function clearStatus() {
  document.getElementById('job-status-el')?.remove();
}

function showError(msg) {
  clearStatus();
  document.getElementById('output-placeholder').classList.add('hidden');
  const div = document.createElement('div');
  div.className = 'error-card';
  div.textContent = '⚠ ' + msg;
  document.getElementById('output-area').prepend(div);
}

function showOutputs(files) {
  document.getElementById('output-placeholder').classList.add('hidden');
  const area = document.getElementById('output-area');

  for (const name of files) {
    const url     = '/outputs/' + encodeURIComponent(name);
    const isVideo = /\.(mp4|gif|webm)$/i.test(name);

    const card = document.createElement('div');
    card.className = 'output-card';
    card.dataset.file = name;

    let media;
    if (isVideo) {
      media = document.createElement('video');
      Object.assign(media, { src: url, autoplay: true, loop: true, muted: true,
                             playsInline: true, controls: true });
    } else {
      media = document.createElement('img');
      media.src = url;
      media.alt = name;
      media.loading = 'lazy';
      media.onclick = () => window.open(url, '_blank');   // replaces the old Open button
    }

    card.append(media, itemMenuButton(name, url, isVideo));
    area.prepend(card);
  }
}

// ── Shared item actions menu ───────────────────────────────────────────────
// One menu serves every result card and gallery tile. Items are built with DOM calls and
// closures rather than an innerHTML string, so a filename with a quote in it can't break
// out into the markup — the old inline `onclick="…('${safeName}')"` handlers needed
// hand-rolled escaping to stay safe.
let menuAnchorBtn = null;

function closeItemMenu() {
  document.getElementById('item-menu').classList.remove('open');
  if (menuAnchorBtn) menuAnchorBtn.classList.remove('open');
  menuAnchorBtn = null;
}

function openItemMenu(btn, name, url, isVideo) {
  closeItemMenu();
  const menu = document.getElementById('item-menu');
  menu.replaceChildren();

  const row = (el, icon, label) => {
    const i = document.createElement('span');
    i.className = 'mi-icon';
    i.textContent = icon;
    el.append(i, document.createTextNode(label));
    menu.appendChild(el);
    return el;
  };
  const action = (icon, label, fn, cls) => {
    const b = document.createElement('button');
    b.type = 'button';
    if (cls) b.className = cls;
    // Close first: these switch mode or open a confirm, and a menu left hanging over the
    // controls they just filled in is exactly what the user has to click away.
    b.onclick = () => { closeItemMenu(); fn(); };
    return row(b, icon, label);
  };

  const dl = document.createElement('a');
  dl.href = url;
  dl.download = name;
  dl.onclick = () => closeItemMenu();
  row(dl, '\u2193', 'Download');

  if (!isVideo) {
    action('\u270E', 'Refine',  () => setRefineFromGallery(name, url));
    action('\u2726', 'Edit',    () => setEditFromGallery(name, url));
    action('\u25B7', 'Animate', () => setAnimateFromGallery(name, url));
  }

  const sep = document.createElement('div');
  sep.className = 'sep';
  menu.appendChild(sep);
  action('\u2715', 'Delete', () => deleteOutput(name), 'danger');

  // Show before measuring — offsetWidth/Height are 0 while display is none.
  menu.classList.add('open');
  btn.classList.add('open');
  menuAnchorBtn = btn;

  const r = btn.getBoundingClientRect();
  let left = r.right - menu.offsetWidth;          // right edges aligned
  let top  = r.bottom + 4;
  if (top + menu.offsetHeight > innerHeight - 8)  // no room below: flip above the button
    top = Math.max(8, r.top - menu.offsetHeight - 4);
  left = Math.max(8, Math.min(left, innerWidth - menu.offsetWidth - 8));
  menu.style.left = left + 'px';
  menu.style.top  = top + 'px';
}

// The "⋯" trigger, shared by tiles and cards.
function itemMenuButton(name, url, isVideo) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'item-menu-btn';
  b.textContent = '\u22EF';
  b.title = 'More actions';
  b.setAttribute('aria-label', 'More actions for ' + name);
  b.onclick = e => {
    // Without this the document handler below would see the click and close the menu we
    // are about to open; it also keeps the click off the media underneath.
    e.stopPropagation();
    if (menuAnchorBtn === b) closeItemMenu();      // same button again: toggle shut
    else openItemMenu(b, name, url, isVideo);
  };
  return b;
}

document.addEventListener('click', e => {
  if (!e.target.closest('.item-menu')) closeItemMenu();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeItemMenu(); });
// The menu is position:fixed against a button that scrolls or reflows away underneath it.
document.getElementById('gallery-grid').addEventListener('scroll', closeItemMenu, { passive: true });
document.getElementById('output-area').addEventListener('scroll', closeItemMenu, { passive: true });
window.addEventListener('resize', closeItemMenu);

function setGalleryCount(n) {
  document.getElementById('gallery-count').textContent =
    n + ' image' + (n !== 1 ? 's' : '');
}

// Shared by the result card and the gallery tile — the file is dropped from BOTH views,
// since one image can be on screen twice at once. `btn` is optional: calls from the "⋯"
// menu have no lasting button to disable, because the menu closes before this runs.
async function deleteOutput(name, btn) {
  if (!confirm(`Delete ${name}?\n\nThis removes the file from outputs/ for good — there is no undo.`)) return;

  const label = btn && btn.textContent;
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const r = await fetch('/outputs/' + encodeURIComponent(name), { method: 'DELETE' });
    if (!r.ok) {
      const detail = await r.json().then(j => j.detail).catch(() => null);
      throw new Error(detail || `HTTP ${r.status}`);
    }
    // Compare in JS rather than building an attribute selector — no escaping to
    // get wrong if a filename ever contains a quote or bracket.
    document.querySelectorAll('[data-file]').forEach(el => {
      if (el.dataset.file === name) el.remove();
    });
    // The gallery is virtualised, so the DOM holds only the visible rows — `galleryItems`
    // is the real list, and dropping the file there is what keeps the count, the scroll
    // height and the off-screen rows honest. Re-render: pulling a tile out shifts every
    // later one into a new grid slot.
    galleryItems = galleryItems.filter(it => it.name !== name);
    setGalleryCount(galleryItems.length);
    renderGalleryWindow(true);
    // Nothing left in the results column — bring the placeholder back.
    if (!document.getElementById('output-area').querySelector('.output-card, .error-card, .job-status')) {
      document.getElementById('output-placeholder').classList.remove('hidden');
    }
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = label; }
    showError('Delete failed: ' + e.message);
  }
}

// ── Gallery ────────────────────────────────────────────────────────────────
// The full file list lives here, not in the DOM — only the rows currently on screen are
// ever built as elements, so a few thousand outputs stay as cheap as a few dozen.
let galleryItems = [];
let galleryWindowKey = '';   // cols:start:end of the last render, to skip redundant work

function galleryTile(item) {
  const name    = item.name;
  const url     = '/outputs/' + encodeURIComponent(name);
  const isVideo = /\.(mp4|gif|webm)$/i.test(name);

  const div = document.createElement('div');
  div.className = 'gallery-item';
  div.dataset.file = name;

  const thumb = document.createElement(isVideo ? 'video' : 'img');
  thumb.className = 'gthumb';
  thumb.src   = url;
  thumb.title = name;
  if (isVideo) { thumb.muted = true; thumb.preload = 'metadata'; }
  else         { thumb.alt = name;   thumb.loading = 'lazy'; }
  thumb.onclick = () => window.open(url, '_blank');

  const label = document.createElement('span');
  label.className = 'gname';
  label.textContent = name;

  div.append(thumb, label, itemMenuButton(name, url, isVideo));
  return div;
}

// Tile geometry comes from the CSS custom properties so there is one source of truth —
// restyling the tiles keeps the scroller's row math correct without touching this code.
function galleryMetrics() {
  const cs = getComputedStyle(document.documentElement);
  const num = n => parseFloat(cs.getPropertyValue(n));
  return { tileW: num('--gtile'), itemH: num('--gitem-h'), gap: num('--ggap') };
}

const GALLERY_OVERSCAN = 2;   // extra rows above and below, so a fast flick stays filled

function renderGalleryWindow(force) {
  const grid  = document.getElementById('gallery-grid');
  const sizer = document.getElementById('gallery-sizer');
  const inner = document.getElementById('gallery-inner');
  // clientWidth is 0 while the panel is collapsed — the column count would be nonsense.
  if (!galleryOpen || !grid.clientWidth) return;

  const n = galleryItems.length;
  if (!n) {
    sizer.style.height = '';
    inner.innerHTML = '<div class="gallery-empty">No outputs yet.</div>';
    galleryWindowKey = 'empty';
    return;
  }

  const { tileW, itemH, gap } = galleryMetrics();
  const cs    = getComputedStyle(grid);
  const avail = grid.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const cols  = Math.max(1, Math.floor((avail + gap) / (tileW + gap)));
  const rows  = Math.ceil(n / cols);
  const rowH  = itemH + gap;

  // Full scroll height, minus the gap that would trail the last row.
  sizer.style.height = (rows * rowH - gap) + 'px';

  const firstRow = Math.max(0, Math.floor(grid.scrollTop / rowH) - GALLERY_OVERSCAN);
  const lastRow  = Math.min(rows - 1,
    Math.floor((grid.scrollTop + grid.clientHeight) / rowH) + GALLERY_OVERSCAN);
  const start = firstRow * cols;
  const end   = Math.min(n, (lastRow + 1) * cols);

  const key = `${cols}:${start}:${end}`;
  if (key === galleryWindowKey && !force) return;
  galleryWindowKey = key;

  inner.style.gridTemplateColumns = `repeat(${cols}, ${tileW}px)`;
  inner.style.transform = `translateY(${firstRow * rowH}px)`;

  const frag = document.createDocumentFragment();
  for (let i = start; i < end; i++) frag.appendChild(galleryTile(galleryItems[i]));
  inner.replaceChildren(frag);
}

async function loadGallery() {
  try {
    galleryItems = await fetch('/gallery').then(r => r.json());
    setGalleryCount(galleryItems.length);
    galleryWindowKey = '';
    renderGalleryWindow(true);
  } catch(e) {
    console.warn('Gallery load failed:', e);
  }
}

// Open, the gallery covers the output area — so anything that wants the output area
// visible again (picking a source, starting a job) closes it first.
function closeGallery() {
  if (galleryOpen) toggleGallery();
}

function toggleGallery() {
  galleryOpen = !galleryOpen;
  document.getElementById('gallery-grid').classList.toggle('open', galleryOpen);
  document.getElementById('gallery-icon').classList.toggle('open', galleryOpen);
  document.getElementById('gallery-section').classList.toggle('open', galleryOpen);
  document.getElementById('workspace').classList.toggle('gallery-open', galleryOpen);
  if (galleryOpen) {
    galleryWindowKey = '';
    loadGallery();
  }
}

// Scroll drives the window; resize changes the column count, so both re-render. rAF keeps
// this to one render per frame no matter how fast the events arrive.
let galleryFrame = 0;
function scheduleGalleryRender(force) {
  if (galleryFrame) return;
  galleryFrame = requestAnimationFrame(() => {
    galleryFrame = 0;
    renderGalleryWindow(force);
  });
}
document.getElementById('gallery-grid')
  .addEventListener('scroll', () => scheduleGalleryRender(false), { passive: true });
window.addEventListener('resize', () => { galleryWindowKey = ''; scheduleGalleryRender(true); });

// ── ComfyUI status ─────────────────────────────────────────────────────────
async function checkComfy() {
  try {
    const { running } = await fetch('/comfy-status').then(r => r.json());
    comfyOnline = running;
  } catch(e) { comfyOnline = false; }
  document.getElementById('status-dot').classList.toggle('online', comfyOnline);
  document.getElementById('status-label').textContent =
    comfyOnline ? 'ComfyUI online' : 'ComfyUI offline';
}

// ── LoRA stack ─────────────────────────────────────────────────────────────
// The stack is a chain: entry N is applied to the model entry N-1 already patched, so
// order is meaningful and the UI exposes it (numbered rows, move up/down) rather than
// pretending the list is a set.
function loraLabel(filename) {
  return filename.replace(/\.(safetensors|ckpt|pt|bin)$/i, '').replace(/[_-]+/g, ' ');
}

async function loadLoras() {
  try {
    const { loras, error } = await fetch('/loras').then(r => r.json());
    if (error) throw new Error(error);
    loraOptions = loras || [];
  } catch(e) {
    console.warn('Could not load LoRAs from ComfyUI:', e);
    loraOptions = [];
  }
  renderLoras();
}

function renderLoras() {
  const list = document.getElementById('lora-list');
  const add  = document.getElementById('lora-add');
  const note = document.getElementById('lora-note');
  list.replaceChildren();

  // A saved stack can outlive the files it names — flag those instead of silently
  // snapping them to some other LoRA, which would generate the wrong image quietly.
  const missing = loraStack.filter(l => l.name && !loraOptions.includes(l.name));

  loraStack.forEach((entry, i) => {
    const row = document.createElement('div');
    row.className = 'lora-row';

    const top = document.createElement('div');
    top.className = 'lora-row-top';

    const ord = document.createElement('span');
    ord.className = 'lora-ord';
    ord.textContent = (i + 1) + '.';

    const sel = document.createElement('select');
    if (!loraOptions.includes(entry.name)) {
      const opt = document.createElement('option');
      opt.value = entry.name;
      opt.textContent = entry.name ? entry.name + ' (missing)' : '— pick a LoRA —';
      sel.appendChild(opt);
    }
    for (const name of loraOptions) {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = loraLabel(name);
      sel.appendChild(opt);
    }
    sel.value = entry.name;
    sel.onchange = () => { entry.name = sel.value; renderLoras(); saveState(); };

    const up = document.createElement('button');
    up.className = 'lora-move'; up.type = 'button';
    up.textContent = '\u2191'; up.title = 'Apply earlier';
    up.disabled = i === 0;
    up.onclick = () => moveLora(i, -1);

    const down = document.createElement('button');
    down.className = 'lora-move'; down.type = 'button';
    down.textContent = '\u2193'; down.title = 'Apply later';
    down.disabled = i === loraStack.length - 1;
    down.onclick = () => moveLora(i, 1);

    const del = document.createElement('button');
    del.className = 'lora-x'; del.type = 'button';
    del.textContent = '\u2715'; del.title = 'Remove';
    del.onclick = () => { loraStack.splice(i, 1); renderLoras(); saveState(); };

    top.append(ord, sel, up, down, del);

    const str = document.createElement('div');
    str.className = 'lora-strength';
    const lbl = document.createElement('span');
    lbl.className = 'lora-ord';
    lbl.textContent = 'Strength';
    const range = document.createElement('input');
    range.type = 'range';
    range.min = '-1'; range.max = '2'; range.step = '0.05';
    range.value = entry.strength;
    const val = document.createElement('span');
    val.className = 'val';
    val.textContent = Number(entry.strength).toFixed(2);
    range.oninput = () => {
      entry.strength = parseFloat(range.value);
      val.textContent = entry.strength.toFixed(2);
    };
    range.onchange = saveState;
    str.append(lbl, range, val);

    row.append(top, str);
    list.appendChild(row);
  });

  const none = loraOptions.length === 0;
  add.disabled = none;
  add.textContent = none ? 'No LoRAs installed' : '+ Add LoRA';
  note.textContent = none
    ? 'Drop .safetensors files into ComfyUI/models/loras/ and reload.'
    : (missing.length
        ? missing.length + ' saved LoRA' + (missing.length > 1 ? 's are' : ' is') + ' no longer installed.'
        : (loraStack.length
            ? 'Applied top to bottom. Most LoRAs need their trigger word in the prompt.'
            : ''));
}

function addLora() {
  if (!loraOptions.length) return;
  loraStack.push({ name: loraOptions[0], strength: 0.8 });
  renderLoras();
  saveState();
}

function moveLora(i, delta) {
  const j = i + delta;
  if (j < 0 || j >= loraStack.length) return;
  [loraStack[i], loraStack[j]] = [loraStack[j], loraStack[i]];
  renderLoras();
  saveState();
}

// What actually goes on the wire: named entries only, in order.
function activeLoras() {
  return loraStack
    .filter(l => l.name && loraOptions.includes(l.name))
    .map(l => ({ name: l.name, strength: l.strength }));
}

// ── Checkpoints ────────────────────────────────────────────────────────────
// Mirrors defaults.BASES — newest architecture first.
const BASE_ORDER = ['FLUX', 'SDXL', 'SD 1.5'];

function ckptLabel(filename) {
  return filename.replace(/\.(safetensors|ckpt|pt|bin)$/i, '').replace(/[_-]+/g, ' ');
}

async function loadCheckpoints() {
  const IDS = ['g-checkpoint', 'r-checkpoint'];
  // Prefer the persisted choice — at boot the selects still hold the "Loading…"
  // placeholder, so loadState() couldn't apply it yet and their value is empty.
  const saved = {};
  for (const id of IDS) saved[id] = savedState[id] || document.getElementById(id).value;

  try {
    const { checkpoints, error } = await fetch('/checkpoints').then(r => r.json());
    if (!checkpoints || !checkpoints.length) throw new Error(error || 'empty list');

    checkpointBase = {};
    for (const c of checkpoints) checkpointBase[c.name] = c.base;
    const names = checkpoints.map(c => c.name);

    for (const id of IDS) {
      const sel = document.getElementById(id);
      sel.innerHTML = '';
      // One <optgroup> per base, in BASE_ORDER; a base with nothing installed is skipped
      // rather than rendered empty. Bases the server reports but this list doesn't know
      // about are appended, so a new family shows up without a frontend change.
      const seen = new Set(checkpoints.map(c => c.base));
      const order = [...BASE_ORDER.filter(b => seen.has(b)),
                     ...[...seen].filter(b => !BASE_ORDER.includes(b)).sort()];
      for (const base of order) {
        const group = document.createElement('optgroup');
        group.label = base;
        for (const c of checkpoints) {
          if (c.base !== base) continue;
          const opt = document.createElement('option');
          opt.value       = c.name;
          opt.textContent = ckptLabel(c.name);
          group.appendChild(opt);
        }
        sel.appendChild(group);
      }
      // Restore saved value if still present, otherwise leave at first option
      if (saved[id] && names.includes(saved[id])) {
        sel.value = saved[id];
      }
    }
  } catch(e) {
    console.warn('Could not load checkpoints from ComfyUI:', e);
    for (const id of IDS) {
      const sel = document.getElementById(id);
      sel.innerHTML = '<option value="">ComfyUI offline</option>';
    }
  }
  // Whatever ended up selected: keep the user's own numbers if they were restored, and
  // only fall back to the checkpoint's recommended config on a first visit.
  for (const [id, prefix, fields] of [
    ['g-checkpoint', 'g', ['g-width', 'g-height', 'g-steps', 'g-cfg']],
    ['r-checkpoint', 'r', ['r-steps', 'r-cfg']],
  ]) {
    const ckpt = document.getElementById(id).value;
    if (fields.every(f => savedState[f] !== undefined && savedState[f] !== '')) {
      applyCheckpointUI(ckpt, prefix);
    } else {
      applyCheckpointConfig(ckpt, prefix);
    }
  }
}

// ── Boot ───────────────────────────────────────────────────────────────────
loadState();
updatePreview();
updateAnimateLength();   // after loadState, so the label matches the restored length/fps
checkComfy();
setInterval(checkComfy, 10000);
loadCheckpoints();
loadLoras();
loadSavedPrompts();
loadGallery();
</script>
</body>
